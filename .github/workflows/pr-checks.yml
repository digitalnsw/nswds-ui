name: PR Checks

# Runs on every PR targeting main. Enforces:
#   - ESLint passes across the workspace
#   - TypeScript typecheck passes across the workspace
#   - Prettier formatting is clean
#   - Every component ships on both channels (barrel + registry) — check:drift
#   - The packed npm artefact is well-formed (publint + arethetypeswrong)
#   - The committed registry JSON (apps/registry/public/r/) matches a fresh
#     `registry:build` — generated output must be committed with source changes
#   - Storybook stories load and pass their play() functions
#   - axe-core a11y checks pass for every story (via @storybook/addon-a11y
#     with `a11y.test: 'error'` in apps/storybook/.storybook/preview.tsx)
#
# Mark "Lint, Typecheck & Storybook a11y" as a required status check in
# Settings → Branches → Branch protection → main to block merges on failure.

on:
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same PR so the freshest commit's results
# are the ones that matter (and we don't burn runner minutes on stale builds).
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Typecheck & Storybook a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .nvmrc (not a pinned node-version) so CI runs the same Node as local
      # dev. With engine-strict=true in .npmrc, npm ci hard-fails unless npm
      # satisfies the root engines (npm >=11.5.1) — Node 22.14.0 ships npm
      # 10.9.2, so a 22.x pin here breaks every install.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      # Every component under packages/ui/src/components must ship on BOTH
      # channels (src/index.ts barrel + registry.json) or be explicitly
      # allowlisted as internal in the script.
      - name: Component drift check
        run: npm run check:drift -w @nswds/ui

      # The generated src/icons/ modules are lint/format-exempt, so this is
      # their only structural guard: every module exports its expected
      # PascalCase icon and the index barrel matches the directory exactly.
      - name: Icon module parity check
        run: npm run check:icons -w @nswds/ui

      # release.yml commits with [skip ci], so the release pipeline is never
      # exercised by PR CI — a mistake in the release config is only visible
      # after it has published, or silently failed to. These tests cover the
      # path-scoped release gate (which decides whether a release happens at
      # all) against a throwaway git repo, so they need no real history and
      # work under this job's shallow checkout.
      - name: Release config tests
        run: npm test -w @workspace/semantic-release-config

      # @nswds/ui's `exports` field points subpath imports
      # (e.g. `@nswds/ui/lib/theme-palette`) at `./dist/lib/*.js`, so the
      # package must be built before Storybook can resolve them.
      # apps/storybook/.storybook/main.ts aliases `@nswds/ui/globals.css`
      # back to source for Tailwind live-scanning, but JS subpath imports
      # still go through `exports` → `dist/`.
      - name: Build @nswds/ui
        run: npm run build -w @nswds/ui

      # publint validates package.json/files/exports against the packed
      # tarball; attw checks that every exports entry resolves with correct
      # types under bundler + node16 ESM resolution. Both run on `npm pack`
      # output, so this is the closest thing to testing what npm consumers
      # actually receive.
      - name: Package checks (publint + attw)
        run: npm run check:package -w @nswds/ui

      # Exercises the packed tarball the way a consumer receives it: cold
      # install into fixtures/consumer, tsc, vite build, and a tree-shaking
      # assertion (unimported icons must not reach the bundle).
      - name: Consumer fixture (pack, install, build, tree-shake)
        run: ./scripts/test-consumer-fixture.sh

      # The registry JSON in apps/registry/public/r/ is generated from
      # packages/ui source and committed to git. Rebuild it here and fail
      # if the committed output is stale — `git status --porcelain` (not
      # `git diff`) so brand-new untracked JSON files are caught too.
      - name: Verify registry output is committed
        run: |
          npm run registry:build -w @nswds/ui
          STATUS="$(git status --porcelain -- apps/registry/public/r)"
          if [ -n "$STATUS" ]; then
            echo "::error::Registry output is stale. Run 'npm run registry:build' and commit the changes in apps/registry/public/r/."
            echo "$STATUS"
            git diff --stat -- apps/registry/public/r
            exit 1
          fi

      # Runs before the (slow) Playwright install so it fails fast. A
      # dependency of packages/ui that is missing from optimizeDeps.include
      # gets discovered mid-run, which reloads the tester page and kills an
      # unrelated story file — the intermittent failure of issue #83.
      - name: Storybook pre-bundle drift check
        run: npm run check:optimize-deps -w @workspace/storybook

      # Playwright system deps live outside ~/.cache/ms-playwright and would
      # need re-installing on every cold runner anyway, so we install both
      # the browser and its apt deps in one step. Roughly 30-60s on a cold
      # runner; the browser binary itself is small (~150MB).
      - name: Install Playwright Chromium
        run: npm exec -w @workspace/storybook -- playwright install chromium --with-deps

      # Vitest browser mode runs every story file as a test. The storybookTest
      # plugin auto-generates a `test()` per story export; @storybook/addon-a11y
      # runs axe-core in an `afterEach` hook and (because preview.tsx sets
      # `a11y.test: 'error'`) any violation fails the test.
      - name: Storybook tests (Vitest browser + axe a11y)
        run: npm run test -w @workspace/storybook

  # Token/theme CSS under packages/ui/src/styles/ changes what EVERY consumer
  # renders, but a `chore:`/`style:`/`refactor:` PR triggers no release, so the
  # visual change would ship to nobody. Require such PRs to carry a releasable
  # type so the change actually reaches consumers. (Assumes squash-merge using
  # the PR title — the repo's convention, enforced by the PR-title commitlint
  # check; the title drives semantic-release's analysis on main.)
  visual-change-release-guard:
    name: Token/style change triggers a release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a releasable type when token/theme CSS changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Check `gh`'s exit status explicitly (a bare `files=$(...)` does NOT
          # reliably trip `set -e`). A gh failure (auth/rate-limit/transient)
          # must fail the step — fail CLOSED — not be swallowed by the grep's
          # `|| true` below and silently pass the guard.
          if ! files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"; then
            echo "::error::Could not fetch the PR diff (gh pr diff failed — auth, rate limit, or transient error). The token/style release guard cannot evaluate the change; re-run this check."
            exit 1
          fi
          changed="$(printf '%s\n' "$files" | grep '^packages/ui/src/styles/' || true)"
          if [ -z "$changed" ]; then
            echo "No token/theme CSS changed under packages/ui/src/styles/ — guard not applicable."
            exit 0
          fi
          echo "Token/theme CSS changed by this PR:"
          echo "$changed"

          # Conventional type from the PR title (e.g. "feat(ui): …" -> feat).
          type="$(printf '%s' "$PR_TITLE" | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')"
          breaking=false
          printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:' && breaking=true
          printf '%s\n' "$PR_BODY" | grep -qE '(^|[[:space:]])BREAKING CHANGE:' && breaking=true

          if printf '%s' "$type" | grep -qE '^(feat|fix|perf|revert)$' \
            || [ "$breaking" = true ]; then
            echo "✔ PR type '${type:-?}' (breaking=${breaking}) triggers a release — the visual change will reach consumers."
            exit 0
          fi

          echo "::error::This PR changes token/theme CSS under packages/ui/src/styles/ but its title type ('${type:-unknown}') does not trigger a release, so the visual change would ship to nobody. Use feat:/fix:/perf: (or add a BREAKING CHANGE footer for a token removal or value change that alters rendered output). See AGENTS.md §6 on versioning visual/token changes."
          exit 1
