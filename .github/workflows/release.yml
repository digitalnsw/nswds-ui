name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: |
          node --version
          npm --version
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          if ! node -e "const version = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (version[0] < 11 || (version[0] === 11 && version[1] < 5) || (version[0] === 11 && version[1] === 5 && version[2] < 1)) process.exit(1)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version
          node -e "const version = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (version[0] < 11 || (version[0] === 11 && version[1] < 5) || (version[0] === 11 && version[1] === 5 && version[2] < 1)) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Build UI package
        run: npm run build -w @nswds/ui

      - name: Capture latest release tag
        id: before_release
        run: |
          tag="$(git tag --list '@nswds/ui-v*' --sort=-v:refname | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Capture published release tag
        id: after_release
        run: |
          tag="$(git tag --list '@nswds/ui-v*' --sort=-v:refname | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # The npm registry is the source of truth for a successful release —
      # semantic-release pushes the version-bump commit and tag BEFORE the
      # npm publish step, so a failed or skipped publish leaves green-looking
      # tags with no package behind them (exactly how v1.8.0–v2.1.0 went
      # missing for a week). Poll npm until the new version appears; fail
      # loudly if it never does.
      - name: Verify the release reached npm
        if: steps.before_release.outputs.tag != steps.after_release.outputs.tag
        run: |
          expected="${{ steps.after_release.outputs.tag }}"
          expected="${expected#@nswds/ui-v}"
          echo "Verifying npm has @nswds/ui@${expected}…"
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "@nswds/ui@${expected}" version 2>/dev/null || true)"
            if [ "$published" = "$expected" ]; then
              echo "✔ npm has @nswds/ui@${expected}"
              exit 0
            fi
            echo "Attempt ${attempt}/6: npm does not have ${expected} yet (got '${published:-nothing}'); retrying in 20s…"
            sleep 20
          done
          echo "::error::Tag @nswds/ui-v${expected} was created but @nswds/ui@${expected} never appeared on npm — the publish failed or was skipped. Check the Release step log; consumers are still receiving the previous version."
          exit 1

      - name: Build shadcn registry
        if: steps.before_release.outputs.tag != steps.after_release.outputs.tag
        run: npm run registry:build

      - name: Upload shadcn registry artifact
        if: steps.before_release.outputs.tag != steps.after_release.outputs.tag
        uses: actions/upload-artifact@v4
        with:
          name: shadcn-registry-${{ github.sha }}
          path: apps/registry/public/r
          if-no-files-found: error

  # Release failures are easy to miss: they happen post-merge where nobody is
  # watching, and semantic-release has already pushed the version tag so the
  # repo LOOKS released. File (or bump) a labelled issue so every failure
  # generates a notification and a visible artefact in the repo — three
  # releases (v1.8.0–v2.1.0) once failed without anyone noticing.
  alert-on-failure:
    name: File release-failure issue
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update the release-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create release-failure \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "Automated: a Release workflow run failed" \
            --force
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="A Release workflow run failed — npm consumers may be stranded on an old version.

          - Run: ${run_url}
          - Commit: ${GITHUB_SHA}
          - Check whether a git tag was pushed without a matching npm version (\`npm view @nswds/ui version\`).

          _Filed automatically by the alert-on-failure job in release.yml._"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Commented on existing issue #$existing"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release workflow failed — npm publish may be broken" \
              --label release-failure \
              --assignee "$GITHUB_ACTOR" \
              --body "$body"
          fi
