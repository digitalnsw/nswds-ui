# OWNED BY THIS REPO — not synced from digitalnsw/nswds-devops, unlike the
# seven workflows here that open with a "Synced from … DO NOT EDIT" header.
# nswds-devops `.github/sync.yml` puts nswds-ui in group 2a, which lists each
# workflow stub INDIVIDUALLY precisely so this file is left alone ("keeps its
# own release.yml AND release config"). Groups 1 and 3 map `workflow-stubs/`
# → `.github/workflows/` wholesale, which would overwrite it; that is the
# difference, and it is the reason to check the group before assuming a shared
# release pipeline. Edit this file here — there is no upstream copy to change,
# and nswds-devops' reusable-release.yml carries no npm verification at all.
# (The "Mirrors nswds-devops reusable-release.yml" note further down is about
# the deploy-key pattern it sits on, not about this file being synced.)
name: Release

on:
  push:
    branches: [main]
  # Manual escape hatch: a push to main can be silently skipped if the HEAD
  # commit message contains a skip-ci directive anywhere — including QUOTED IN
  # PROSE in a squashed commit body, which is exactly how the v2.1.1 release
  # failed to trigger. This lets a stranded release be run by hand.
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Bounded deliberately. This job contains two polling loops (~10 min of
    # sleeps each, for npm and for the registry deploy) and an npm ci, and it
    # is the one job in the repo nobody is watching when it runs. Without a
    # timeout a wedged poll or a hung install sits on GitHub's 6-hour default
    # before alert-on-failure can fire — defeating the point of that job.
    # Worst case is both polls exhausting: ~10 min for npm, and up to ~17 min
    # for the registry (10 min of sleeps plus 20 curls that can each burn
    # their 20s --max-time), on top of ~5 min of install, build and release.
    # 40 clears that; 30 did not.
    timeout-minutes: 40
    env:
      # main is ruleset-protected: semantic-release pushes the version-bump
      # commit over SSH as a deploy key that's a bypass actor on the ruleset
      # (GITHUB_TOKEN can't push once required status checks are enforced).
      # Mirrors nswds-devops reusable-release.yml.
      HAS_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout (deploy key)
        if: ${{ env.HAS_DEPLOY_KEY == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Checkout
        if: ${{ env.HAS_DEPLOY_KEY != 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: |
          node --version
          npm --version
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          if ! node -e "const version = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (version[0] < 11 || (version[0] === 11 && version[1] < 5) || (version[0] === 11 && version[1] === 5 && version[2] < 1)) process.exit(1)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version
          node -e "const version = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (version[0] < 11 || (version[0] === 11 && version[1] < 5) || (version[0] === 11 && version[1] === 5 && version[2] < 1)) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Build UI package
        run: npm run build -w @nswds/ui

      - name: Capture latest release tag
        id: before_release
        run: |
          tag="$(git tag --list '@nswds/ui-v*' --sort=-v:refname | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Capture published release tag
        id: after_release
        run: |
          tag="$(git tag --list '@nswds/ui-v*' --sort=-v:refname | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # The npm registry is the source of truth for a successful release —
      # semantic-release pushes the version-bump commit and tag BEFORE the
      # npm publish step, so a failed or skipped publish leaves green-looking
      # tags with no package behind them (exactly how v1.8.0–v2.1.0 went
      # missing for a week). Poll npm until the new version appears; fail
      # loudly if it never does.
      #
      # The ~10-minute budget and the --prefer-online are both load-bearing,
      # and neither substitutes for the other.
      #
      #   - `npm publish` returns BEFORE the version is readable, and says so:
      #     "Your package is being processed and may take a few minutes to
      #     become available." This is what called v7.0.0 a failed release and
      #     filed a release-failure issue against a publish that had already
      #     succeeded — semantic-release logged "Published @nswds/ui@7.0.0" at
      #     23:49:29, npm recorded the version at 23:52:06, and the budget here
      #     was 100 seconds. Hence ~10 minutes, matching the registry poll.
      #   - The packument is cached TWICE, and the flag and the budget close
      #     one layer each — so neither is safe to trim on the strength of the
      #     other. It is served `cache-control: public, max-age=300`.
      #     LOCALLY, `npm view` is cache-first over the ~/.npm that setup-node's
      #     `cache: npm` restores, and both `npm ci` and the `npm install
      #     --package-lock-only` inside the release step resolve @nswds/ui — so
      #     without `--prefer-online` a packument fetched minutes earlier in
      #     this same job can be replayed from _cacache for the full max-age
      #     without a request ever leaving the runner. `--prefer-online` forces
      #     that request. It does NOT make the answer fresh: the registry is
      #     fronted by an edge cache (responses carry a non-zero `age`, e.g.
      #     `age: 232`), so a revalidation can still be answered from a copy up
      #     to 5 minutes old. Only a budget longer than max-age covers that
      #     half. Whether either layer bit on v7.0.0 is unknowable after the
      #     fact — a stale hit and a slow publish are indistinguishable from
      #     the outside — which is why both are closed rather than one.
      #
      # A generous budget costs time only when the release has genuinely failed,
      # and nobody is waiting on this job. A tight one costs a false alarm on a
      # good release, which is worse — it trains the next person to disbelieve
      # the alert.
      - name: Verify the release reached npm
        if: steps.before_release.outputs.tag != steps.after_release.outputs.tag
        run: |
          expected="${{ steps.after_release.outputs.tag }}"
          expected="${expected#@nswds/ui-v}"
          echo "Verifying npm has @nswds/ui@${expected}…"
          for attempt in $(seq 1 20); do
            published="$(npm view --prefer-online "@nswds/ui@${expected}" version 2>/dev/null || true)"
            if [ "$published" = "$expected" ]; then
              echo "✔ npm has @nswds/ui@${expected}"
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              echo "Attempt ${attempt}/20: npm does not have ${expected} yet (got '${published:-nothing}'); retrying in 30s…"
              sleep 30
            fi
          done
          echo "::error::Tag @nswds/ui-v${expected} was created but @nswds/ui@${expected} did not appear on npm within ~10 minutes — the publish failed, was skipped, or is stuck in npm's post-publish processing. Check the Release step log for a 'Published @nswds/ui@${expected}' line: if it is there the publish itself succeeded and this is npm-side latency; if it is not, consumers are still receiving the previous version."
          exit 1

      # The shadcn registry is the second distribution channel and must track
      # npm. Vercel (nswds-ui-registry) deploys it from the version-bump commit
      # semantic-release just pushed — gated by apps/registry/vercel.json's
      # ignoreCommand. That deploy is async, so poll the LIVE version.json until
      # it reports the new version. This catches a failed/stuck registry deploy
      # within minutes instead of up to a week later via the weekly drift audit
      # (release-drift-audit.yml), and replaces the build-and-upload-artifact
      # step that previously ran here but was never consumed.
      - name: Verify the registry deploy reached production
        if: steps.before_release.outputs.tag != steps.after_release.outputs.tag
        env:
          # Optional override; otherwise the committed source of truth is used.
          REGISTRY_LOCATION_OVERRIDE: ${{ vars.REGISTRY_LOCATION }}
        run: |
          expected="${{ steps.after_release.outputs.tag }}"
          expected="${expected#@nswds/ui-v}"
          # `// empty` -> null/absent .location becomes empty (not the literal
          # "null"); 2>/dev/null swallows a missing/invalid registry.config.json.
          location="${REGISTRY_LOCATION_OVERRIDE:-$(jq -r '.location // empty' registry.config.json 2>/dev/null)}"
          if [ -z "$location" ] || [ "$location" = "null" ]; then
            echo "::error::Could not resolve the registry URL — set the REGISTRY_LOCATION repo variable or ensure registry.config.json has a non-null .location. (Not polling: this is a config error, not a deploy failure.)"
            exit 1
          fi
          url="${location%/}/r/version.json"
          echo "Verifying ${url} reports ${expected}…"
          # ~10 min budget: Vercel queues the build on the pushed commit, then
          # runs build + registry:build + vite build before the deploy is live.
          for attempt in $(seq 1 20); do
            deployed="$(curl -sf --max-time 20 "$url" | jq -r '.version' 2>/dev/null || true)"
            if [ "$deployed" = "$expected" ]; then
              echo "✔ registry deploy is live at ${expected}"
              exit 0
            fi
            echo "Attempt ${attempt}/20: registry reports '${deployed:-nothing}', want ${expected}; retrying in 30s…"
            sleep 30
          done
          echo "::error::The registry at ${location} did not report ${expected} after ~10 minutes — the Vercel deploy likely failed or is stuck. npm has the new version but registry consumers are stranded on the previous one. Check the nswds-ui-registry deployment."
          exit 1

  # Release failures are easy to miss: they happen post-merge where nobody is
  # watching, and semantic-release has already pushed the version tag so the
  # repo LOOKS released. File (or bump) a labelled issue so every failure
  # generates a notification and a visible artefact in the repo — three
  # releases (v1.8.0–v2.1.0) once failed without anyone noticing.
  alert-on-failure:
    name: File release-failure issue
    needs: release
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update the release-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create release-failure \
            --repo "$GITHUB_REPOSITORY" \
            --color B60205 \
            --description "Automated: a Release workflow run failed" \
            --force
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="A Release workflow run failed — npm consumers may be stranded on an old version.

          - Run: ${run_url}
          - Commit: ${GITHUB_SHA}
          - Check whether a git tag was pushed without a matching npm version (\`npm view @nswds/ui version\`).

          _Filed automatically by the alert-on-failure job in release.yml._"
          # Assign to the actor ONLY when the actor is assignable. A push to
          # main can come from a bot (renovate[bot] on auto-merge, the
          # nswds-devops file-sync bot), and `gh issue create --assignee` fails
          # outright on a name it cannot resolve — which would lose the very
          # alert this job exists to raise. The issue is worth more than the
          # assignment, so the assignment is what gets dropped.
          assign=()
          case "$GITHUB_ACTOR" in
            *'[bot]') echo "Actor '$GITHUB_ACTOR' is a bot — filing unassigned." ;;
            *) assign=(--assignee "$GITHUB_ACTOR") ;;
          esac

          open_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --label release-failure \
              --state open --json number --jq '.[0].number // empty'
          }
          create_issue() {
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release workflow failed — npm publish may be broken" \
              --label release-failure \
              --body "$body" "$@"
          }

          existing="$(open_issue)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Commented on existing issue #$existing"
          elif create_issue "${assign[@]}"; then
            echo "Filed a new release-failure issue."
          else
            # The assignment can be rejected for reasons the bot check above
            # does not cover (the actor left the org, lost access). Re-query
            # before retrying: gh can fail AFTER the issue was created
            # server-side, and a blind retry would then file a second issue for
            # one failure — noise on exactly the signal that has to stay clear.
            filed="$(open_issue)"
            if [ -n "$filed" ]; then
              echo "Issue #$filed was created despite the error — not filing a duplicate."
            else
              echo "Create with --assignee failed; retrying unassigned."
              create_issue
            fi
          fi
