name: Chromatic

# Visual regression testing over the Storybook catalogue. This is the gate
# that proves "no visual change" claims (patch releases legitimately change
# pixels in a design system — this is how those changes get reviewed).
#
# SETUP (one-time, requires a Chromatic account):
#   1. Create a project at https://www.chromatic.com for this repo.
#   2. Add the project token as the CHROMATIC_PROJECT_TOKEN repo secret.
#   3. Mark "Visual regression" as a required status check in branch protection.
# If the secret is missing in a trusted context (push to main, same-repo PR)
# the job FAILS rather than silently passing — a missing visual-regression gate
# is exactly the green-but-unverified state a design system can't afford. Fork
# PRs (where secrets are unavailable by design) skip with a warning instead, so
# external contributors aren't blocked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromatic:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check for project token
        id: token
        run: |
          if [ -n "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            # Secrets are unavailable to fork PRs by design — don't block
            # external contributors, but surface that the gate did not run.
            echo "::warning::CHROMATIC_PROJECT_TOKEN is unavailable on fork PRs — visual regression was skipped. A maintainer must run it (e.g. push the branch to this repo, or re-run after merge) before the change is considered visually reviewed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CHROMATIC_PROJECT_TOKEN is not configured. Visual regression is a required gate for this design system — add the secret (see this file's header). Failing rather than silently passing."
            exit 1
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          # Chromatic uses git history for baseline selection.
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          # .nvmrc — engine-strict=true needs npm >=11.5.1 (see pr-checks.yml).
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build @nswds/ui
        if: steps.token.outputs.present == 'true'
        run: npm run build -w @nswds/ui

      - name: Publish to Chromatic
        if: steps.token.outputs.present == 'true'
        uses: chromaui/action@14cfaef73576e69f95f47f60058063f46ca38719 # v18.1.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build
          # Snapshot only stories affected by the change — keeps usage within
          # the free tier for most PRs.
          onlyChanged: true
          # Changes on main become the new baseline automatically; PRs still
          # require explicit acceptance in the Chromatic UI.
          autoAcceptChanges: main
